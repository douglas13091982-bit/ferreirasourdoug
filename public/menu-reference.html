<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ferreira Sourdough</title>
<style>
:root{--bg:#EFE8D6;--card:#FFFBF2;--dark:#12200F;--accent:#2F5A2F;--gold:#E2B95C;--text:#5A5038;--border:#E3D7B8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,:before,:after{box-sizing:inherit}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--dark)}
.menu{max-width:430px;margin:24px auto;background:var(--card);border:1px solid var(--border);border-radius:20px;overflow:clip;box-shadow:0 12px 30px rgba(0,0,0,.1)}
header{background:#12200F;color:#F3EAD6;text-align:center;padding:28px 18px}header img{width:96px;height:96px;display:block;margin:0 auto 12px;object-fit:contain}header h1{margin:0;font-size:30px;letter-spacing:2px;color:var(--gold)}header p{margin:8px 0 0;color:#E4D9BC;font-size:14px;line-height:1.5}
.wa{background:#1B2B18;padding:18px;text-align:center}.wa a{display:inline-block;background:var(--gold);color:#22190A;font-weight:bold;text-decoration:none;padding:13px 26px;border-radius:10px}.wa small{display:block;margin-top:10px;color:#CFC4A6;line-height:1.4;font-size:13px}
.cats{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border)}.cats::-webkit-scrollbar{display:none}.cats a{flex:none;scroll-snap-align:start;text-decoration:none;font-size:14px;font-weight:bold;color:var(--dark);padding:9px 18px;border:1px solid var(--border);border-radius:99px;white-space:nowrap}.cats a.on{background:var(--gold);border-color:var(--gold);color:#22190A}
.section{padding:22px;border-top:1px solid var(--border);scroll-margin-top:64px}.section h2{margin:0 0 16px;font-size:22px;color:var(--accent);border-bottom:2px solid var(--border);padding-bottom:8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:16px 0}.ph{width:76px;height:76px;border-radius:12px;object-fit:cover;flex:none;background:var(--border)}.tx{flex:1;min-width:0}.item h3{margin:0;font-size:16px}.item p{margin:5px 0 0;font-size:13px;line-height:1.45;color:var(--text)}.rt{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}.price{font-weight:800;white-space:nowrap}.price small{font-weight:400;color:var(--text)}
.btn{display:inline-block;background:var(--gold);color:#22190A;font:bold 13px Arial,sans-serif;border:0;padding:8px 14px;border-radius:8px;cursor:pointer;text-decoration:none}.qty{display:inline-flex;align-items:center;border:1px solid var(--gold);border-radius:8px;overflow:hidden}.qty button{width:30px;height:30px;border:0;background:var(--gold);color:#22190A;font:bold 17px sans-serif;cursor:pointer}.qty b{min-width:28px;text-align:center;font-size:14px}
.bar{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;max-width:398px;margin:0 auto;display:none;justify-content:space-between;background:var(--gold);color:#22190A;border:0;border-radius:12px;padding:14px 18px;font:bold 16px Arial,sans-serif;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.35)}body.has .bar{display:flex}
.sh{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}.sh.on{display:flex}.sh>div{background:var(--card);color:var(--dark);width:100%;max-width:430px;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}.sh h3{margin:0 0 8px;font-size:22px}.x{float:right;background:none;border:0;font-size:26px;color:var(--text);cursor:pointer}.ln{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}.ln small,.nt{color:var(--text)}fieldset{border:1px solid var(--border);border-radius:10px;margin:12px 0 4px;padding:8px 12px}legend{font-size:12px;font-weight:bold;color:var(--text);padding:0 6px}.op{display:flex;align-items:center;padding:6px 0;font-size:15px}.sh input[type=radio]{width:auto;margin:0 10px 0 0;accent-color:#C99A2E}.sh input:not([type=radio]){width:100%;padding:11px;margin:6px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--dark);font:inherit}.gd{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tot{display:flex;justify-content:space-between;font-weight:bold;font-size:20px;margin:14px 0}.footer{background:#12200F;color:#F3EAD6;text-align:center;padding:18px;font-size:13px;line-height:1.6}.footer a{color:var(--gold)}
@media(max-width:470px){.menu{margin:0 auto;border-radius:0;border-left:0;border-right:0;min-height:100vh;box-shadow:none}}
</style>
</head>
<body>
<div class="menu">
<header><img id="logo" alt="Ferreira Sourdough"><h1 id="name">Ferreira Sourdough</h1><p id="subtitle">Pães, Pizza e Charcutaria Artesanal</p></header>
<div class="wa"><a id="wa" href="#" target="_blank">Falar pelo WhatsApp</a><small>Faça seu pedido pelo cardápio e envie diretamente para a loja.</small></div>
<nav class="cats" id="cats"></nav>
<main id="ms"></main>
<div class="footer">Ferreira Sourdough<br>Joinville - SC</div>
</div>
<button class="bar" id="bar" type="button"><span id="bn">Ver pedido (0 itens)</span><span id="bt">R$ 0,00</span></button>
<div class="sh" id="sh" role="dialog" aria-modal="true"><div><button class="x" id="xx" type="button">×</button><h3>Seu pedido</h3><div id="ls"></div>

<div id="fe"><div class="gd"><input id="cep" placeholder="CEP"><input id="num" placeholder="Número"></div><input id="endereco" placeholder="Rua / endereço de entrega"><div class="gd"><input id="bairro" placeholder="Bairro"><input id="cidade" placeholder="Cidade" value="Joinville - SC"></div><input id="comp" placeholder="Complemento / ponto de referência"></div>

<input id="nm" placeholder="Seu nome"><input id="tel" placeholder="Seu telefone / WhatsApp"><input id="obs" placeholder="Observações do pedido (opcional)">
<div class="ln"><span>Subtotal</span><span id="st"></span></div><div class="ln"><span>Frete</span><span id="fv"></span></div><div class="tot"><span>Total</span><span id="tt"></span></div>
<p class="nt" id="er" style="color:#E2564A" role="alert"></p><button class="btn" id="go" type="button" style="width:100%;padding:14px;font-size:15px">Enviar pedido pelo WhatsApp</button></div></div>
<script>
var WA='5547988776543',R=function(n){return 'R$ '+Number(n||0).toFixed(2).replace('.',',')},$=function(x){return document.getElementById(x)};
var CATS=[],I=[],C={},M='entrega',frete=null,ENDX={},FRETE={token:'',porKm:2.5,minimo:7,raioMax:20,base:0,origin:'Rua Frederico Hubner, 37, América, Joinville - SC, 89204-280, Brasil'},FRETE_ERRO='',FRETE_BUSY=false,STORE_GEOCODE=null;
function q(id){return C[id]||0} function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function slug(n,id){return String(n||'produto').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60)+'-'+String(id||'').slice(0,8)}
function render(){var nav=$('cats'),h='';nav.innerHTML='';CATS.forEach(function(c,i){var a=document.createElement('a');a.href='#'+c[0];a.textContent=c[1];if(i===0)a.className='on';nav.appendChild(a);h+='<section class="section" id="'+esc(c[0])+'"><h2>'+esc(c[1])+'</h2>';I.filter(function(x){return x.c===c[0]}).forEach(function(x){var act=x.p===null?'<a class="btn" target="_blank" href="https://wa.me/'+WA+'?text='+encodeURIComponent('Olá! Quero saber o valor: '+x.n)+'">Consultar</a>':q(x.id)?'<span class="qty"><button data-m="'+esc(x.id)+'">−</button><b>'+q(x.id)+'</b><button data-p="'+esc(x.id)+'">+</button></span>':'<button class="btn" data-p="'+esc(x.id)+'">Adicionar</button>';h+='<div class="item"><a href="/produto/'+slug(x.n,x.id)+'" target="_top" style="display:block"><img class="ph" src="'+esc(x.i||'')+'" alt="'+esc(x.n)+'"></a><div class="tx"><h3>'+esc(x.n)+'</h3><p>'+esc(x.d||'')+'</p></div><div class="rt"><span class="price">'+(x.p===null?'<small>Sob consulta</small>':R(x.p)+(x.u?' <small>'+esc(x.u)+'</small>':''))+'</span>'+act+'</div></div>'});h+='</section>'});$('ms').innerHTML=h||'<section class="section"><p>Nenhum produto disponível.</p></section>';sum();bindCats()}
function bindCats(){var links=[].slice.call($('cats').querySelectorAll('a'));links.forEach(function(a,i){a.onclick=function(){links.forEach(function(x){x.classList.remove('on')});a.classList.add('on')}})}
function sum(){var n=0,t=0;I.forEach(function(x){if(q(x.id)){n+=q(x.id);t+=q(x.id)*Number(x.p||0)}});document.body.classList.toggle('has',n>0);$('bn').textContent='Ver pedido ('+n+(n===1?' item)':' itens)');$('bt').textContent=R(t)}
function subtotal(){var t=0;I.forEach(function(x){if(q(x.id))t+=q(x.id)*Number(x.p||0)});return t}
function sheet(){var h='';I.forEach(function(x){if(q(x.id))h+='<div class="ln"><span>'+esc(x.n)+'<br><small>'+R(x.p||0)+' '+esc(x.u||'')+'</small></span><span class="qty"><button data-m="'+esc(x.id)+'">−</button><b>'+q(x.id)+'</b><button data-p="'+esc(x.id)+'">+</button></span></div>'});$('ls').innerHTML=h||'<p>Seu pedido está vazio.</p>';$('fe').hidden=M!=='entrega';$('fr').hidden=M!=='retirada';var t=subtotal();$('st').textContent=R(t);$('fv').textContent=M==='retirada'?'Grátis (retirada)':frete===null?(FRETE_BUSY?'Calculando…':(FRETE_ERRO?'Indisponível':'A calcular')):R(frete);$('tt').textContent=R(t+(frete||0))+(M==='entrega'&&frete===null?' + frete':'')}
function mapboxUrl(path,p){var u=new URLSearchParams(p||{});u.set('access_token',FRETE.token);return 'https://api.mapbox.com'+path+'?'+u}
function mapboxJson(u){return fetch(u,{headers:{Accept:'application/json'}}).then(function(r){if(!r.ok)throw Error('Mapbox HTTP '+r.status);return r.json()})}
function geocode(t){if(!FRETE.token)return Promise.reject(Error('Token Mapbox não configurado.'));return mapboxJson(mapboxUrl('/search/geocode/v6/forward',{q:t,country:'BR',language:'pt',limit:'1',autocomplete:'false'})).then(function(d){var f=d&&d.features&&d.features[0];if(!f||!f.geometry)return Promise.reject(Error('Endereço não encontrado.'));return {lat:Number(f.geometry.coordinates[1]),lng:Number(f.geometry.coordinates[0])}})}
function calcFrete(end){if(M!=='entrega')return Promise.resolve(0);if(!FRETE.token)return Promise.reject(Error('Token Mapbox não configurado.'));FRETE_BUSY=true;FRETE_ERRO='';sheet();var origin=STORE_GEOCODE?Promise.resolve(STORE_GEOCODE):geocode(FRETE.origin).then(function(p){return STORE_GEOCODE=p});var dest=end.lat!=null&&end.lng!=null?Promise.resolve(end):geocode([end.rua,end.numero,end.bairro,end.cidade,'SC','Brasil'].filter(Boolean).join(', '));return Promise.all([origin,dest]).then(function(a){return mapboxJson(mapboxUrl('/directions/v5/mapbox/driving/'+a[0].lng+','+a[0].lat+';'+a[1].lng+','+a[1].lat,{overview:'false'}))}).then(function(r){if(!r.routes||!r.routes[0])throw Error('Não foi possível calcular a rota.');var km=Number(r.routes[0].distance||0)/1000;if(FRETE.raioMax>0&&km>FRETE.raioMax)throw Error('Esse endereço está fora da área de entrega.');return Math.round(Math.max(FRETE.minimo,FRETE.base+km*FRETE.porKm)*100)/100}).catch(function(e){FRETE_ERRO=e.message||'Não foi possível calcular o frete.';throw e}).finally(function(){FRETE_BUSY=false;sheet()})}
function getEnd(){return Object.assign({rua:$('endereco').value,numero:$('num').value,bairro:$('bairro').value,cidade:$('cidade').value,cep:$('cep').value,comp:$('comp').value},ENDX)}
function recalc(){if(M!=='entrega'){frete=0;sheet();return}calcFrete(getEnd()).then(function(v){frete=v;sheet()}).catch(function(){frete=null;sheet()})}
function applyDelivery(d){if(!d)return;FRETE.token=d.mapbox_token||FRETE.token;FRETE.origin=d.origin_address||FRETE.origin;FRETE.porKm=Number(d.price_per_km!=null?d.price_per_km:FRETE.porKm);FRETE.minimo=Number(d.minimum_fee!=null?d.minimum_fee:FRETE.minimo);FRETE.base=Number(d.base_fee!=null?d.base_fee:FRETE.base);FRETE.raioMax=Number(d.max_delivery_km!=null?d.max_delivery_km:FRETE.raioMax)}
window.addEventListener('message',function(e){if(e.origin!==window.location.origin)return;var d=e.data||{};if(d.mapboxToken)FRETE.token=d.mapboxToken;if(d.delivery)applyDelivery(d.delivery);if(d.type==='FERREIRA_CATALOG'&&d.catalog&&Array.isArray(d.catalog.prods)){CATS=(d.catalog.cats||[]).map(function(x){return[x.id,x.n]});I=d.catalog.prods.map(function(x){return{id:x.id,c:x.c,n:x.n,d:x.d||'',p:x.p==null?null:Number(x.p),u:x.u||'',i:x.i||''}});render();}if(d.type==='FERREIRA_CATALOG'||d.type==='FERREIRA_DELIVERY_CONFIG'){FRETE_ERRO='';if(M==='entrega'&&Object.keys(C).length)recalc();}});
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var d=b.dataset;if(d.p){C[d.p]=q(d.p)+1;render();sheet()}else if(d.m){C[d.m]=Math.max(0,q(d.m)-1);render();sheet()}});
$('bar').onclick=function(){sheet();$('sh').classList.add('on')};$('xx').onclick=function(){$('sh').classList.remove('on')};$('sh').onclick=function(e){if(e.target===$('sh'))$('sh').classList.remove('on')};
document.querySelectorAll('input[name=md]').forEach(function(r){r.onchange=function(){M=r.value;recalc()}});document.querySelectorAll('input[name=pg]').forEach(function(r){r.onchange=function(){$('troco').hidden=r.value!=='Dinheiro'}});['cep','num','endereco','bairro'].forEach(function(i){$(i).onchange=recalc});
$('go').onclick=function(){var er=$('er'),t=subtotal(),E=getEnd();er.textContent='';if(!t){er.textContent='Adicione itens ao pedido.';return}if(!$('nm').value.trim()||!$('tel').value.trim()){er.textContent='Informe seu nome e telefone.';return}if(M==='entrega'&&(!E.rua.trim()||!E.numero.trim()||!E.bairro.trim())){er.textContent='Informe rua, número e bairro para a entrega.';return}if(M==='entrega'&&frete===null){er.textContent=FRETE_ERRO||'Aguarde o cálculo do frete.';return}var lines='';I.forEach(function(x){if(q(x.id))lines+='• '+q(x.id)+'x '+x.n+' – '+R(q(x.id)*Number(x.p||0))+'\n'});var pg=document.querySelector('input[name=pg]:checked').value,m='Olá, Ferreira Sourdough! Gostaria de fazer um pedido:\n'+lines+'\nSubtotal: '+R(t)+'\n';m+=M==='entrega'?'Frete: '+R(frete)+'\nTotal: '+R(t+frete)+'\n\nENTREGA\n'+E.rua+', '+E.numero+' – '+E.bairro+' – '+E.cidade+(E.cep?' – CEP '+E.cep:'')+(E.comp?'\nRef.: '+E.comp:''):'Total: '+R(t)+'\n\nRETIRADA NA LOJA';m+='\n\nPagamento: '+pg+($('troco').value?' (troco para '+$('troco').value+')':'')+'\nNome: '+$('nm').value+'\nTelefone: '+$('tel').value+($('obs').value?'\nObs.: '+$('obs').value:'');window.open('https://wa.me/'+WA+'?text='+encodeURIComponent(m),'_blank')};
$('wa').href='https://wa.me/'+WA;render();sheet();
</script></body></html>
